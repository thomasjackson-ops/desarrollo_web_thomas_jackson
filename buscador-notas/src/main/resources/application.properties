spring.application.name=buscador-notas

# misma base de datos tarea2 de las tareas anteriores, mismas credenciales
# que exige el enunciado (cc5002/programacionweb en localhost:3306)
spring.datasource.url=jdbc:mysql://localhost:3306/tarea2?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Santiago
spring.datasource.username=cc5002
spring.datasource.password=programacionweb
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ddl-auto=none porque la tabla nota ya viene creada con tabla-nota.sql, no
# quiero que hibernate intente crear ni modificar nada del esquema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

server.port=8080
